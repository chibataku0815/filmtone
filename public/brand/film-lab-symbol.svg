<?xml version="1.0" encoding="UTF-8"?>
<!--
  Film Lab symbol mark (viewport frame, variant A).

  One rounded stroke inside a dark rounded square. No photos or gradients.
  For light-background use, duplicate and invert fills if needed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Film Lab">
  <rect width="64" height="64" rx="14" fill="#111111"/>
  <rect
    x="14"
    y="14"
    width="36"
    height="36"
    rx="8"
    fill="none"
    stroke="#EAE6DD"
    stroke-width="2.5"
  />
</svg>
