# Path repairs in non-pbxproj files
# Each repair is `file:line` → swap the listed source filename with its new
# folder path. Build-relevant repairs are MUST. Documentation repairs are
# SHOULD (keeps paused lane resumption clean). Anything not listed is
# either archive content (handoffs, closed lanes) or already-broken state
# unrelated to this refactor (e.g. stale test reference to nonexistent
# FilmtonePhase0Generated.swift in apps/capacitor-film-lab-ios/, which
# actually lives in packages/film-lab-swift-core/Sources/...).
path_repairs:
  must_repair_active_scripts:
    - file: scripts/generate-filmtone-swift.ts
      line: 41
      from: ios/App/App/FilmtoneOpticalFiltersGenerated.swift
      to: ios/App/App/Optics/FilmtoneOpticalFiltersGenerated.swift
    - file: scripts/check-ios-grain-catalog.mjs
      line: 8
      from: ios/App/App/FilmtoneStrengthSheetData.swift
      to: ios/App/App/Editor/FilmtoneStrengthSheetData.swift
    - file: scripts/check-ios-grain-catalog.mjs
      line: 9
      from: ios/App/App/FilmtoneStrings.swift
      to: ios/App/App/Strings/FilmtoneStrings.swift
    - file: apps/capacitor-film-lab-ios/scripts/verify-phase0-contract.sh
      lines: [11, 12, 18, 97, 111, 125, 148, 149, 150, 151, 158, 175, 202, 203, 221]
      mappings:
        FilmtonePhase0Math.swift: Source/FilmtonePhase0Math.swift
        FilmtoneMotionBlurMath.swift: Optics/FilmtoneMotionBlurMath.swift
        FilmtoneSourceProfileSchema.swift: Source/FilmtoneSourceProfileSchema.swift
        FilmtoneCubeParser.swift: Look/FilmtoneCubeParser.swift
        FilmtoneCaptureTransformLutClassifier.swift: Capture/FilmtoneCaptureTransformLutClassifier.swift
        CacheStore.swift: Services/CacheStore.swift
        SourceColorMetadataNormalizer.swift: Source/SourceColorMetadataNormalizer.swift
        SourceColorClassifier.swift: Source/SourceColorClassifier.swift
        FilmtoneColorPipeline.swift: Look/FilmtoneColorPipeline.swift
        HdrPreparationPolicyDeriver.swift: Export/HdrPreparationPolicyDeriver.swift
        FilmtoneRayAngleOptics.swift: Optics/FilmtoneRayAngleOptics.swift
        FilmtoneSourceProfileMath.swift: Source/FilmtoneSourceProfileMath.swift
        FilmtoneExportSidecarBuilder.swift: Export/FilmtoneExportSidecarBuilder.swift
        FilmtoneLutBlobCodec.swift: Look/FilmtoneLutBlobCodec.swift
    - file: apps/capacitor-film-lab-ios/scripts/davinci/verify-highlight-marker-import.sh
      lines: [11, 14, 15, 127]
      mappings:
        FilmtoneSourceProfileSchema.swift: Source/FilmtoneSourceProfileSchema.swift
        FilmtoneExportSidecarBuilder.swift: Export/FilmtoneExportSidecarBuilder.swift
        FilmtoneLutBlobCodec.swift: Look/FilmtoneLutBlobCodec.swift
        FilmtoneColorPipeline.swift: Look/FilmtoneColorPipeline.swift

  should_repair_paused_lane_docs:
    - file: docs/filmtone/ios/capture-practicality/paused/2026-05-09-s1-stabilization-toggle-pending-owner-smoke.md
      mapping_target: Capture
    - file: docs/filmtone/ios/capture-practicality/paused/2026-05-09-s2-active-lens-visibility-pending-owner-smoke.md
