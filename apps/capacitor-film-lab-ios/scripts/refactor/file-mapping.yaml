# Filmtone iOS Feature-Based Architecture Refactor — File Mapping
#
# Phase 1A artifact. Read by migrate-pbxproj.rb and the path-repair sed script.
# All paths are relative to apps/capacitor-film-lab-ios/ios/App/App/.
# Source of truth for what the refactor moves where.
#
# Categorization is explicit per-file (not regex-based) so review can be
# line-by-line. The mapping moves the former flat root set: 108 .swift +
# 1 .metal = 109 entries. ExportActivity/ (3 files) is left in place and
# not listed here.

source_root: apps/capacitor-film-lab-ios/ios/App/App

folders:
  Root:
    description: App entry surfaces — AppDelegate, root router, root chrome, empty view, onboarding, orientation lock. Named Root/ (not App/) because the pbxproj parent group is already named "App" and double-nesting App/App/ is confusing on disk and in git paths.
